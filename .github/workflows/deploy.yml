name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Assemble site (public files only)
        run: |
          mkdir _site
          cp -r index.html 404.html assets css js content sitemap.xml robots.txt manifest.webmanifest _site/
          rm -rf _site/assets/img/source
          SITE_URL="${{ steps.pages.outputs.base_url }}"
          sed -i "s|__SITE_URL__|${SITE_URL}|g" _site/index.html _site/sitemap.xml _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
